name: Verify MLOps modules

on:
  push:
    branches: [main, 'audit/**']
    paths-ignore: ['docs/**', '**/README.md', 'README.md', 'requirements-docs.txt', 'scripts/render_study_docs.py']
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r serving/requirements.txt -r kafka-streaming/requirements.txt -r bedrock-explainer/requirements.txt -r requirements-test.txt
      - run: python -m pytest tests -q --junitxml=tests.xml
      - run: python serving/train.py
      - name: Test a live Uvicorn process
        run: |
          python -m uvicorn app:app --app-dir serving --host 127.0.0.1 --port 8767 > uvicorn.log 2>&1 &
          python scripts/check_http.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python }}-evidence
          path: |
            tests.xml
            serving/model_metadata.json
            uvicorn.log

  kafka:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kafka-streaming
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait kafka spam-api
      - name: Create topics before the independent output observer starts
        run: |
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic messages --partitions 1 --replication-factor 1
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic predictions --partitions 1 --replication-factor 1
      - run: docker compose up -d --build consumer
      - run: docker compose run --rm -T producer python producer.py --count 8 --interval 0.05
      - name: Verify real broker outputs and committed offsets
        run: docker compose run --rm --no-deps -T consumer python - < ../scripts/check_stream.py
      - name: Save logs
        if: always()
        run: |
          docker compose logs --no-color > ../kafka.log
          docker compose logs --no-color consumer spam-api
      - run: docker compose down -v
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kafka-evidence
          path: kafka.log

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    defaults:
      run:
        working-directory: terraform-localstack
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: docker compose up -d
      - name: Wait for LocalStack
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4566/_localstack/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: terraform init -input=false -lockfile=readonly
      - run: terraform fmt -check
      - run: terraform validate
      - run: terraform plan -input=false -out=plan.tfplan
      - run: terraform apply -input=false -auto-approve plan.tfplan
      - name: Verify actual emulator resources
        run: |
          test "$(terraform output -raw bucket_name)" = mlops-model-artifacts
          test "$(terraform output -raw table_name)" = predictions
          docker compose exec -T localstack awslocal s3api head-bucket --bucket mlops-model-artifacts
          docker compose exec -T localstack awslocal dynamodb describe-table --table-name predictions
          terraform plan -input=false -detailed-exitcode
      - name: Destroy isolated test resources
        if: always()
        run: terraform destroy -input=false -auto-approve
      - run: docker compose down -v
        if: always()

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: mlops-test
      - run: docker build -t mlops-serving:latest serving
      - run: kind load docker-image mlops-serving:latest --name mlops-test
      - run: kubectl apply -f kubernetes/deployment.yaml -f kubernetes/service.yaml
      - run: kubectl rollout status deployment/spam-api --timeout=180s
      - name: Verify replicas and real HTTP prediction
        run: |
          test "$(kubectl get deployment spam-api -o jsonpath='{.status.readyReplicas}')" = 2
          kubectl port-forward service/spam-api 8767:8000 > port-forward.log 2>&1 &
          python scripts/check_http.py
      - name: Verify pod replacement
        run: |
          POD=$(kubectl get pods -l app=spam-api -o jsonpath='{.items[0].metadata.name}')
          kubectl delete pod "$POD" --wait=true
          kubectl rollout status deployment/spam-api --timeout=180s
          test "$(kubectl get deployment spam-api -o jsonpath='{.status.readyReplicas}')" = 2
          kubectl get pods -l app=spam-api
      - run: kubectl get pods -o wide && kubectl describe deployment spam-api
        if: always()
      - run: kind delete cluster --name mlops-test
        if: always()
